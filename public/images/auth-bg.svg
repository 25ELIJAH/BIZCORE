<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="0.45" stop-color="#ffdcb4"/>
      <stop offset="0.8" stop-color="#f9a971"/>
      <stop offset="1" stop-color="#ef7a45"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe9"/>
      <stop offset="0.45" stop-color="#ffe3a8"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a5a"/>
      <stop offset="1" stop-color="#d9603f"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9523f"/>
      <stop offset="1" stop-color="#7b3d5a"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3586"/>
      <stop offset="1" stop-color="#261a66"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- the sun and its glow -->
  <circle cx="1130" cy="430" r="330" fill="url(#sun)"/>
  <circle cx="1130" cy="430" r="92" fill="#fff4d2"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="300" cy="210" rx="190" ry="26"/>
    <ellipse cx="390" cy="188" rx="120" ry="22"/>
    <ellipse cx="1380" cy="150" rx="170" ry="22"/>
    <ellipse cx="1290" cy="172" rx="100" ry="18"/>
    <ellipse cx="760" cy="300" rx="140" ry="16" opacity="0.7"/>
  </g>

  <!-- layered hills, light to deep -->
  <path d="M0 640 C 220 560 400 600 620 650 C 840 700 1010 560 1240 575 C 1420 586 1520 640 1600 620 L1600 1000 L0 1000 Z" fill="url(#far)" opacity="0.85"/>
  <path d="M0 740 C 200 680 380 720 580 760 C 800 805 980 700 1200 705 C 1400 710 1500 760 1600 740 L1600 1000 L0 1000 Z" fill="url(#mid)" opacity="0.92"/>
  <path d="M0 850 C 240 800 420 850 650 868 C 900 888 1060 810 1300 820 C 1460 826 1540 860 1600 850 L1600 1000 L0 1000 Z" fill="url(#near)"/>

  <!-- a few warm windows, like a town waking up -->
  <g fill="#ffd18a" opacity="0.9">
    <rect x="212" y="896" width="10" height="14" rx="2"/>
    <rect x="236" y="896" width="10" height="14" rx="2"/>
    <rect x="224" y="918" width="10" height="14" rx="2"/>
    <rect x="1010" y="880" width="10" height="14" rx="2"/>
    <rect x="1034" y="880" width="10" height="14" rx="2"/>
    <rect x="1370" y="890" width="10" height="14" rx="2"/>
  </g>
</svg>
